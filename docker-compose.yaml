services:
  db:
    image: docker.io/postgres:15-alpine
    container_name: koara_db_container
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '4001:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koara_backend_container
    env_file: .env
    ports:
      - '4000:4000'
    expose:
      - '4000'
    depends_on:
      - db

volumes:
  postgres_data:
